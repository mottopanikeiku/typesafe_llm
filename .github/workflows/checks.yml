name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Behavioral regression tests
        run: python -m unittest discover -s tests -v
      - name: Exhaustive synthetic search comparison
        run: python offline_demo.py --exhaustive
      - name: Decoder dry run
        run: python typesafe_llm.py 'Complete a short sentence.' --tokens-json examples/subword_tokens.json --dry-run
      - name: Benchmark dry run
        run: python benchmark.py --dry-run --repeats 2 --max-total-calls 7
